# -----------------------------------
# Rifle configuration file
# -----------------------------------
# Priority | Condition             | Command
# ---------+------------------------+--------------------------

# Video files → VLC
mime ^video, has vlc, X, flag f = vlc -- "$@"
ext mkv|mp4|avi|mov, has vlc, X, flag f = vlc -- "$@"

# Audio files → VLC
#mime ^audio, has vlc, X, flag f = vlc -- "$@"
#ext mp3|wav|ogg, has vlc, X, flag f = vlc -- "$@"

# Text/code files → nvim
ext txt|md|log|json|js|ts|cpp|c|py|go|rs, has nvim, terminal, flag f = nvim "$@"
mime ^text, has nvim, terminal, flag f = nvim "$@"

# Images → feh
mime ^image, has feh, X, flag f = feh -- "$@"
ext jpg|jpeg|png|gif, has feh, X, flag f = feh -- "$@"

# PDFs → zathura
ext pdf, has zathura, X, flag f = zathura "$@"

# HTML → open in browser
ext html|htm, has firefox, X, flag f = firefox "$@"

# Default GUI opener fallback
!mime ^inode, has xdg-open, X, flag f = xdg-open "$@"

# Fallback to nvim if all else fails
!mime ^inode, has nvim, terminal, flag f = nvim "$@"

