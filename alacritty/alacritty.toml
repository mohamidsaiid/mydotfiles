[window]
opacity = 0.7
dynamic_title = true
decorations = "full"

[window.padding]
x = 8
y = 6

[font]
size = 10.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[colors.primary]
background = "#1e1b29"
foreground = "#cfc6ff"

[colors.normal]
black   = "#1e1b29"
red     = "#ff5c93"
green   = "#a8ff60"
yellow  = "#ffd700"
blue    = "#5a3dad"
magenta = "#a183ff"
cyan    = "#00d3d0"
white   = "#cfc6ff"

[colors.bright]
black   = "#44475a"
red     = "#ff6e96"
green   = "#b0ff87"
yellow  = "#ffe066"
blue    = "#7b5cf2"
magenta = "#bd99ff"
cyan    = "#33f6f4"
white   = "#ffffff"

[cursor.style]
shape = "Block"
blinking = "On"

[selection]
save_to_clipboard = true

[terminal]

[terminal.shell]
program = "/bin/zsh"

