
#################################
#          Backend              #
#################################

backend = "glx";  # GLX backend for hardware acceleration
vsync = true;      # Synchronize with the display to avoid screen tearing

#################################
#           General             #
#################################

shadow = false;  # Disable shadows for all windows
fading = true;
fade-delta = 8;
fade-in-step = 0.04;     # Slower fade-in
fade-out-step = 0.04;    # Slower fade-out

corner-radius = 10;  # Radius for window corners to make them rounded
round-borders = 1;   # Enable rounded borders
log-level = "warn";  # Set logging level for picom (to avoid excessive logs)
use-damage = true;   # Enable damage-based rendering to improve performance

#################################
#          Transparency         #
#################################

inactive-opacity = 0.85;  # Set the opacity of inactive windows
active-opacity = 1;    # Set the opacity of active windows (fully opaque)
frame-opacity = 0.9;     # Set opacity of window frames (borders and titlebars)
inactive-opacity-override = false;  # Do not override opacity settings for inactive windows

# Enable blur effect for window backgrounds
blur-background = true;  
blur-background-frame = false;  # Apply blur to window frame as well
blur-strength = 10;    # Strength of the blur effect (higher value for more blur)

#################################
#             Blur              #
#################################

# Apply the dual_kawase blur method, known for smoother effects
blur:
{
  method = "dual_kawase";
  strength = 10;  # Adjust the strength of the blur effect
  background = true;  # Enable blur for the background
  background-frame = false;  # Apply blur to window frame as well
  background-fixed = true;  # Keep the background fixed when blurring
};

#################################
#         Window Types          #
#################################

wintypes:
{
  tooltip = { blur-background = true; };  # Apply blur effect on tooltips
  dock = { shadow = false; blur-background = true; };  # Disable shadow for dock windows, but enable blur
  dnd = { shadow = false; };  # No shadow for drag-and-drop windows
  popup_menu = { shadow = false; blur-background = true; };  # Enable blur for popup menus
  dropdown_menu = { shadow = false; blur-background = true; };  # Enable blur for dropdown menus
  notification = { shadow = false; blur-background = true; };  # Enable blur for notifications
  utility = { shadow = false; };  # No shadow for utility windows

  # Ensure Polybar is NOT excluded from blur
  polybar = { blur-background = true; shadow = true; };
  i3lock = {blur-background = true; shadow = true;};
  fullscreen = {blur-background = false; };
};

#################################
#         Corner Fixes          #
#################################

# Exclude i3-frame from rounding corners and blur effects
#rounded-corners-exclude = [
#  "class_g = 'i3-frame'"
#];

opacity-rule = [
  "100:class_g = 'mpv'",
  "100:class_g = 'vlc'",
  "60:class_g = 'i3lock'",
  "100:class_g = 'miam'"
];

blur-background-exclude = [
  "class_g = 'i3-frame'" , # Exclude i3-frame from blur effect
  "class_g = 'miam'"
];



